services:
  db:
    image: postgres:16-alpine
    container-name: postgres-db
    restart: always
    environemnt:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: 
      -"5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
volumes:
  - postgres_data

